name: Build macOS Remote Support

# Outputs, under the run's Artifacts:
#   CLT-Mac-arm64, CLT-Mac-x64   the client packages: upload each zip as-is on AMS (IT Assets → Settings → Remote Access)
#   AMS-Remote-Setup-pkg         the installer stub: AMS-Remote-Setup.pkg goes in the AMS repo, Services/RemoteControl/Assets/
# Only the Swift app and the .pkg need a Mac; the .NET binaries cross-compile on Linux (install.sh signs them on the Mac).

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "Agent/**"
      - "Desktop/**"
      - "Shared/**"
      - "SupportApp/**"
      - "Installer/**"
      - "LaunchDaemons/**"
      - "pkg/**"
      - ".github/workflows/build.yml"

jobs:
  dotnet:
    name: CLT-Agent + CLT-Desktop (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [arm64, x64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Publish
        run: |
          dotnet publish Agent/Agent.csproj -c Release -r osx-${{ matrix.arch }} -o out
          dotnet publish Desktop/Desktop.csproj -c Release -r osx-${{ matrix.arch }} -o out
      - uses: actions/upload-artifact@v4
        with:
          name: net-${{ matrix.arch }}
          path: |
            out/CLT-Agent
            out/CLT-Desktop
          retention-days: 1

  mac:
    name: IT Remote Support app + installer pkg
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - name: Build the app (universal)
        working-directory: SupportApp
        run: |
          swift build -c release --arch arm64 --arch x86_64
          BIN="$(swift build -c release --arch arm64 --arch x86_64 --show-bin-path)"
          APP="$GITHUB_WORKSPACE/out/AMS Remote Support.app"
          mkdir -p "$APP/Contents/MacOS"
          cp "$BIN/AMS-Remote-Support" "$APP/Contents/MacOS/"
          cp Info.plist "$APP/Contents/"
          lipo -info "$APP/Contents/MacOS/AMS-Remote-Support"
      - name: Build AMS-Remote-Setup.pkg
        run: |
          mkdir -p pkg-scripts
          cp pkg/postinstall Installer/install.sh Installer/uninstall.sh pkg-scripts/
          chmod 755 pkg-scripts/*
          pkgbuild --nopayload --scripts pkg-scripts --identifier com.ams.remote-setup --version 1.0 out/AMS-Remote-Setup.pkg
          pkgutil --expand out/AMS-Remote-Setup.pkg expanded && ls -R expanded
      - uses: actions/upload-artifact@v4
        with:
          name: app
          path: out/AMS Remote Support.app
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: AMS-Remote-Setup-pkg
          path: out/AMS-Remote-Setup.pkg
          retention-days: 30

  package:
    name: CLT-Mac-${{ matrix.arch }}
    needs: [dotnet, mac]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [arm64, x64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: net-${{ matrix.arch }}
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: app
          path: dist/AMS Remote Support.app
      - name: Wrap CLT-Desktop as IT Remote Control, add the launchd plists and the uninstaller
        run: |
          HELPER="dist/AMS Remote Control.app/Contents"
          mkdir -p "$HELPER/MacOS"
          mv dist/CLT-Desktop "$HELPER/MacOS/"
          cp Desktop/Info.plist "$HELPER/"
          cp LaunchDaemons/*.plist Installer/uninstall.sh dist/
          ls -lR dist
      # The artifact zip is the package: its files sit at the root, and install.sh restores the permissions it drops.
      - uses: actions/upload-artifact@v4
        with:
          name: CLT-Mac-${{ matrix.arch }}
          path: dist/
          retention-days: 30
